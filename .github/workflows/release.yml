name: Build and Release Multi-Platform Binaries

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to attach binaries to (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Documents-Image-Extractor-Windows.exe
          - os: ubuntu-latest
            artifact_name: Documents-Image-Extractor-Linux
          - os: macos-latest
            artifact_name: Documents-Image-Extractor-macOS.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build Windows binary
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconsole --onefile --icon=assets/icon.ico --name="Documents-Image-Extractor" --add-data "assets;assets" main.py
          cp dist/Documents-Image-Extractor.exe dist/${{ matrix.artifact_name }}

      - name: Build Linux binary
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconsole --onefile --name="Documents-Image-Extractor" --add-data "assets:assets" main.py
          chmod +x dist/Documents-Image-Extractor
          cp dist/Documents-Image-Extractor dist/${{ matrix.artifact_name }}

      - name: Build macOS binary
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --name="Documents-Image-Extractor" --icon=assets/icon.icns --add-data "assets:assets" main.py
          cd dist 
          zip -r ${{ matrix.artifact_name }} Documents-Image-Extractor.app

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact_name }}
          tag_name: ${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
